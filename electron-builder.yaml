# Planstrand desktop packaging. Publishing and store uploads are intentionally disabled.
appId: io.github.hychaw.planstrand
productName: Planstrand
artifactName: Planstrand-${arch}.${ext}
files:
  - LICENSE
  - electron/**/*
  - '!electron/**/*.ts'
  - '!electron/**/*.js.map'
  - .tmp/angular-dist/**/*
  - '!**/@nx/nx-darwin-*/**'
  - '!**/@nx/nx-linux-*/**'
  - '!**/@nx/nx-win32-*/**'
  - '!**/@capacitor/**'
  - '!**/@capawesome/**'
  - '!**/capacitor-plugin-safe-area/**'
  - '!**/sharp/**'
  - '!**/@img/**'
  - '!**/@lmdb/**'
  - '!**/@rollup/**'
  - '!**/@material-symbols/**'
  - '!**/@noble/**'
  - '!**/hash-wasm/**'
  - '!**/uuidv7/**'
directories:
  output: ./.tmp/app-builds
beforePack: ./tools/beforePack.js
afterPack: ./tools/afterPack.js
win:
  target:
    - nsis
    - portable
  signAndEditExecutable: true
nsis:
  artifactName: Planstrand-Setup.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  packElevateHelper: false
  shortcutName: Planstrand
  uninstallDisplayName: Planstrand
portable:
  artifactName: Planstrand-Portable.${ext}
linux:
  executableName: planstrand
  category: Office;ProjectManagement
  mimeTypes:
    - x-scheme-handler/planstrand
  desktop:
    entry:
      StartupWMClass: planstrand
  target:
    - AppImage
    - deb
rpm:
  fpm:
    - '--rpm-rpmbuild-define=_build_id_links none'
mac:
  appId: io.github.hychaw.planstrand
  icon: build/icon.icns
  type: distribution
  category: public.app-category.productivity
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  notarize: false
  extendInfo:
    ITSAppUsesNonExemptEncryption: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
        - universal
  identity: null
dmg:
  sign: false
pkg:
  publish: never
publish: null
