<div class="wrapper">
  @if (isDataLoaded()) {
    <page-title />
  }
  <div class="pill-slot"></div>
  <nav
    class="action-nav-right"
    aria-label="Planstrand controls"
  >
    <a
      mat-icon-button
      class="utility-trigger"
      routerLink="/search"
      aria-label="Search"
      matTooltip="Search"
      ><mat-icon>search</mat-icon></a
    >
    <button
      mat-icon-button
      class="utility-trigger"
      popovertarget="planstrand-utilities"
      aria-label="Utilities"
      matTooltip="Utilities"
    >
      <mat-icon>tune</mat-icon>
    </button>
    <div
      class="action-nav-scroll"
      id="planstrand-utilities"
      popover="auto"
      #actionScroll
      (keydown.escape)="closeUtilities($event)"
      (click)="onUtilityAction($event)"
    >
      <span class="utility-caption">Utilities</span>
      <button
        mat-icon-button
        autofocus
        class="utility-close"
        aria-label="Close"
        (click)="closeUtilities($event)"
      >
        <mat-icon>close</mat-icon>
      </button>
      <button
        mat-icon-button
        class="tour-addBtn"
        aria-label="Add Task"
        matTooltip="Add Task"
        (click)="planstrand.createTask(inboxId)"
      >
        <mat-icon>add</mat-icon>
      </button>
      @if (isDataLoaded()) {
        <button
          class="sync-btn secondary-header-action"
          [class.is-error]="
            syncIsEnabledAndReady() &&
            (syncState() === 'ERROR' || syncState() === 'INCOMPATIBLE')
          "
          [class.is-offline]="syncIsEnabledAndReady() && !isOnline()"
          [class.is-in-progress]="syncIsEnabledAndReady() && isSyncInProgress()"
          [attr.aria-label]="syncTooltip() | translate"
          matTooltip="{{ syncTooltip() | translate }}"
          (click)="onSyncButtonClick()"
          (longPress)="setupSync()"
          (contextmenu)="$event.preventDefault(); setupSync()"
          mat-icon-button
        >
          @if (syncIsEnabledAndReady()) {
            @if (isOnline()) {
              @if (syncState() === 'ERROR' || syncState() === 'INCOMPATIBLE') {
                <mat-icon>sync_problem</mat-icon>
              } @else {
                <mat-icon [class.spin]="isSyncInProgress()">sync</mat-icon>
              }
              @if (hasNoPendingOps()) {
                @if (superSyncIsConfirmedInSync()) {
                  <mat-icon class="sync-state-ico">done_all</mat-icon>
                } @else {
                  <mat-icon class="sync-state-ico">check</mat-icon>
                }
              }
            } @else {
              <mat-icon>wifi_off</mat-icon>
            }
          } @else {
            <mat-icon>sync_disabled</mat-icon>
          }
        </button>
      }
    </div>
    <button
      mat-icon-button
      class="utility-trigger"
      [matMenuTriggerFor]="appMenu"
      aria-label="App menu"
      matTooltip="App menu"
    >
      <mat-icon>person</mat-icon>
    </button>
    <mat-menu #appMenu="matMenu">
      <a
        mat-menu-item
        routerLink="/config"
        ><mat-icon>settings</mat-icon><span>Settings</span></a
      >
      <a
        mat-menu-item
        routerLink="/help"
        ><mat-icon>help_outline</mat-icon><span>Help</span></a
      >
      <a
        mat-menu-item
        routerLink="/about"
        ><mat-icon>info</mat-icon><span>About</span></a
      >
    </mat-menu>
  </nav>
</div>
