name: Planstrand Release Candidate
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Exact reviewed 40-character commit SHA
        required: true
        type: string
      release_tag:
        description: Existing RC tag matching planstrand-product.json and the reviewed SHA
        required: true
        type: string
      create_draft:
        description: Create a new draft prerelease after validation (never update an existing release)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: planstrand-release-${{ inputs.release_tag }}
  cancel-in-progress: false
jobs:
  windows:
    if: github.repository == 'hychaw/planstrand'
    runs-on: windows-latest
    env:
      RELEASE_REF: ${{ inputs.ref }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    outputs:
      revision: ${{ steps.release.outputs.revision }}
      artifactName: ${{ steps.release.outputs.artifactName }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm
      - name: Validate reviewed commit, RC tag, product version, notes and new release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/planstrand-release.cjs verify-ref
      - run: npm ci
      - name: Release contracts
        run: node --test tools/verify-planstrand-release.test.cjs tools/planstrand-release.test.cjs tools/verify-windows-artifact-contract.test.js tools/verify-linux-wm-class.test.js
      - name: Production desktop build
        shell: pwsh
        run: |
          $env:GITHUB_SHA = git rev-parse HEAD
          npm run build
      - name: Unsigned Windows x64 packages
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Verify packaged imports
        run: node tools/verify-electron-requires.js .tmp/app-builds/win-unpacked/resources/app.asar
      - name: Packaged application smoke
        run: node e2e/electron/planstrand-rc-smoke.cjs .tmp/app-builds/win-unpacked/Planstrand.exe
      - name: Portable launcher and isolated installer smoke
        run: node e2e/electron/planstrand-portable-smoke.cjs .tmp/app-builds/Planstrand-Portable.exe
      - name: Verify Windows product metadata
        shell: pwsh
        run: |
          $version = (Get-Content planstrand-product.json -Raw | ConvertFrom-Json).version
          foreach ($name in @('Planstrand-Setup.exe', 'Planstrand-Portable.exe')) {
            $file = Get-Item -LiteralPath (Join-Path '.tmp/app-builds' $name)
            if ($file.VersionInfo.ProductName -ne 'Planstrand' -or $file.VersionInfo.ProductVersion -ne $version) { throw "Product metadata mismatch: $name" }
          }
          $main = Get-Item -LiteralPath '.tmp/app-builds/win-unpacked/Planstrand.exe'
          $numericVersion = [Version](($version -split '-')[0] + '.0')
          if ($main.VersionInfo.ProductName -ne 'Planstrand' -or $main.VersionInfo.ProductVersionRaw -ne $numericVersion) { throw 'Numeric Windows product version mismatch' }
      - name: Validate packaged revision and licenses; record checksums and provenance
        run: node tools/planstrand-release.cjs record-artifacts .tmp/app-builds
      - name: Recheck release absence before uploading candidates
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/planstrand-release.cjs verify-ref
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.artifactName }}
          path: |
            .tmp/app-builds/Planstrand-Setup.exe
            .tmp/app-builds/Planstrand-Portable.exe
            .tmp/app-builds/SHA256SUMS.txt
            .tmp/app-builds/SOURCE_SHA.txt
            .tmp/app-builds/release-manifest.json
          if-no-files-found: error
  draft:
    if: github.repository == 'hychaw/planstrand' && inputs.create_draft
    needs: windows
    runs-on: ubuntu-latest
    environment: planstrand-release
    permissions:
      contents: write
    env:
      RELEASE_REF: ${{ needs.windows.outputs.revision }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.windows.outputs.revision }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.windows.outputs.artifactName }}
          path: artifacts
      - name: Verify downloaded assets against reviewed revision and packaging configuration
        run: node tools/planstrand-release.cjs verify-artifacts artifacts
      - name: Recheck tag, product version and release absence
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/planstrand-release.cjs verify-ref
      - name: Create new draft prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release.outputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" artifacts/Planstrand-Setup.exe artifacts/Planstrand-Portable.exe artifacts/SHA256SUMS.txt artifacts/SOURCE_SHA.txt artifacts/release-manifest.json --repo hychaw/planstrand --verify-tag --target "$RELEASE_REF" --draft --prerelease --latest=false --title "Planstrand $RELEASE_TAG" --notes-file "$RELEASE_NOTES"
