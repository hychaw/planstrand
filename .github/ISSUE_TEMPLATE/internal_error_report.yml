name: Internal app error
description: Report an error shown inside Planstrand.
body:
  - type: input
    id: environment-version
    attributes:
      label: Version and environment
      description: Include the Planstrand version, OS, and installer, portable, or local web build.
      placeholder: v1.0.0-rc.1, Windows x64, portable
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence that shows the problem.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: current-behavior
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: console-output
    attributes:
      label: Additional context
      description: Add screenshots or relevant logs, with personal data and credentials removed. Follow SECURITY.md for exploitable vulnerabilities.
