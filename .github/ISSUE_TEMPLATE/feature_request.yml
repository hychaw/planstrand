name: Feature request
description: Propose an improvement to Planstrand.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain the need and any current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the desired result and alternatives considered.
    validations:
      required: true
